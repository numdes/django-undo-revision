[project]
name = "django-undo-revision"
version = "1.0.0"
description = "Django reusable app for revision-based undo functionality with django-simple-history"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "django-simple-history>=3.11.0",
    "deepdiff>=8.0.0",
    "typing-extensions>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["undo_revision"]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "django-stubs>=5.0.0",
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "--no-migrations"

[tool.ruff]
preview = true
line-length = 120

[tool.ruff.lint]
extend-select = [
    "B",
    "C4",
    "DJ",
    "FURB",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "RUF",
    "SIM",
    "TCH",
    "UP",
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "N801",
    "N802",
    "N803",
    "N806",
    "PLR0912",
    "PLR0913",
    "PLR6301",
]

[tool.ruff.lint.pylint]
max-positional-args = 6

[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[[tool.mypy.overrides]]
module = "simple_history.*"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"undo_revision/migrations/*" = ["RUF012"]
