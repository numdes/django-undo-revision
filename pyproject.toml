[project]
name = "django-undo-revision"
version = "2.0.0"
description = "Django reusable app for revision-based undo functionality with django-simple-history"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Eduard Charsov", email = "info@numdes.com" },
]
maintainers = [
    { name = "numdes", email = "info@numdes.com" },
]
keywords = [
    "django",
    "undo",
    "revision",
    "history",
    "rollback",
    "django-simple-history",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
    "django-simple-history>=3.11.0",
    "typing-extensions>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/numdes/django-undo-revision"
Repository = "https://github.com/numdes/django-undo-revision"
"Bug Tracker" = "https://github.com/numdes/django-undo-revision/issues"
Changelog = "https://github.com/numdes/django-undo-revision/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["undo_revision"]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "django-stubs>=5.0.0",
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "--no-migrations"

[tool.ruff]
preview = true
line-length = 120

[tool.ruff.lint]
extend-select = [
    "B",
    "C4",
    "DJ",
    "FURB",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "RUF",
    "SIM",
    "TCH",
    "UP",
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "N801",
    "N802",
    "N803",
    "N806",
    "PLR0912",
    "PLR0913",
    "PLR6301",
]

[tool.ruff.lint.pylint]
max-positional-args = 6

[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[[tool.mypy.overrides]]
module = "simple_history.*"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"undo_revision/migrations/*" = ["RUF012"]
